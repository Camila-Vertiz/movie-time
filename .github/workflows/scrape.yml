name: Update cinema schedules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: cinema-schedule-scrape
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and sync schedules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SCRAPER_USER_AGENT: ${{ secrets.SCRAPER_USER_AGENT }}
      SCRAPER_ENABLED_CHAINS: ${{ secrets.SCRAPER_ENABLED_CHAINS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Scrape and sync enabled cinemas
        run: npm run scrape
